<!doctype html>
<html>
<head><meta charset="utf-8"><title>Booking form</title></head>
<body>
  <input aria-label="Guest name">
  <button>Book now</button>
  <script src="../page_map.js"></script>
  <script>
    // The parent asks once everything has loaded (a frame from another site
    // only gets its size a moment after it loads).
    window.addEventListener("message", (e) => {
      if (e.source === parent && e.data === "page map please") parent.postMessage(window.handoffPage.map(), "*");
    });
  </script>
</body>
</html>
