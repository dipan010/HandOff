services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-udaa-489513}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - USE_FIRESTORE=${USE_FIRESTORE:-false}
      - COMPUTER_USE_MODEL=${COMPUTER_USE_MODEL:-gemini-2.5-computer-use-preview-10-2025}
      - LIVE_MODEL=${LIVE_MODEL:-gemini-2.5-flash-native-audio-preview-12-2025}
      - SCREEN_WIDTH=1440
      - SCREEN_HEIGHT=900
    volumes:
      - ~/.config/gcloud:/root/.config/gcloud:ro # Google sign-in for local Firestore testing

  frontend:
    image: node:20-slim
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: npm run dev
    environment:
      - NODE_ENV=development
